name: Extract UI Hebrew Strings (PR + Test APK)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hebrew UI extraction script
        run: python3 .github/scripts/extract_ui_strings.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK to verify compilation
        run: ./gradlew assembleDebug

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-i18n-test
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Extract hardcoded Hebrew UI strings to strings.xml"
          title: "העברת כיתובי ממשק בעברית לקובץ strings.xml"
          body: |
            תהליך זה חילץ אוטומטית את כיתובי הממשק בעברית מתוך קבצי ה-UI אל `app/src/main/res/values/strings.xml`, ואימת שהאפליקציה מתקמפלת בהצלחה.
            
            * **לבדיקת השינויים בקוד:** עברו ללשונית **Files changed**.
            * **להורדת גרסת בדיקה לטאבלט:** היכנסו לריצת ה-Action והורידו את `app-debug-i18n-test` תחת **Artifacts**.
            * **לאישור סופי:** לחצו על **Merge pull request**.
          branch: auto-i18n-hebrew
          delete-branch: true
